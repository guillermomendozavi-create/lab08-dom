<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de tareas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 30px auto; }
    li { margin: 6px 0; }
    .hecha { text-decoration: line-through; color: #888; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Mi lista de tareas</h1>
  <form id="form">
    <input id="texto" type="text" placeholder="Nueva tarea">
    <button type="submit">Agregar</button>
  </form>
  <p id="mensaje" class="error"></p>
  <input id="buscar" type="text" placeholder="Buscar tarea">
  <ul id="lista"></ul>
  <p id="resumen"></p>
  <script src="app.js"></script>
</body>
</html>
